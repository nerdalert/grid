apiVersion: forge.praxis.dev/v1alpha1
kind: Environment
metadata:
  name: grid-signals-combined-site
spec:
  runtime:
    provider: docker
    clusterPrefix: grid-signals
  network:
    crossCluster: true
    dnsZone: grid-signals.test
  clusters:
  - name: west
    stacks:
    - metallb
    - west-operator-base
    - llmd-backend
    - west-site
    - provider-gateway
    - consumer-gateway
    properties:
      region: west
      role: combined
      siteName: west
      gatewayImage: ghcr.io/praxis-proxy/ai:0.7.0
      operatorImage: ghcr.io/praxis-proxy/grid-operator:v0.1.4
      vcrImage: llm-d-inference-sim:deterministic
      imagePullPolicy: IfNotPresent
      gatewayImageRepo: ghcr.io/praxis-proxy/ai
      gatewayImageTag: 0.7.0
      operatorImageRepo: ghcr.io/praxis-proxy/grid-operator
      operatorImageTag: v0.1.4
      eppImage: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.11.0
      poolName: west
  - name: central
    stacks:
    - metallb
    - central-operator-base
    - llmd-backend
    - central-site
    - provider-gateway
    - consumer-gateway
    properties:
      region: central
      role: combined
      siteName: central
      gatewayImage: ghcr.io/praxis-proxy/ai:0.7.0
      operatorImage: ghcr.io/praxis-proxy/grid-operator:v0.1.4
      vcrImage: llm-d-inference-sim:deterministic
      imagePullPolicy: IfNotPresent
      gatewayImageRepo: ghcr.io/praxis-proxy/ai
      gatewayImageTag: 0.7.0
      operatorImageRepo: ghcr.io/praxis-proxy/grid-operator
      operatorImageTag: v0.1.4
      eppImage: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.11.0
      poolName: central
  - name: east
    stacks:
    - metallb
    - east-operator-base
    - llmd-backend
    - east-site
    - provider-gateway
    - consumer-gateway
    properties:
      region: east
      role: combined
      siteName: east
      gatewayImage: ghcr.io/praxis-proxy/ai:0.7.0
      operatorImage: ghcr.io/praxis-proxy/grid-operator:v0.1.4
      vcrImage: llm-d-inference-sim:deterministic
      imagePullPolicy: IfNotPresent
      gatewayImageRepo: ghcr.io/praxis-proxy/ai
      gatewayImageTag: 0.7.0
      operatorImageRepo: ghcr.io/praxis-proxy/grid-operator
      operatorImageTag: v0.1.4
      eppImage: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.11.0
      poolName: east
  stacks:
    metallb:
      description: MetalLB load balancer with auto-configured address pool
      steps:
      - type: url
        url: https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
        sha256: 951065e85692aa106f1bb5d5a487d9306154923a794ab1d82122881cbaf588e4
      - type: wait
        resource: deployment/controller
        namespace: metallb-system
        condition: available
        timeout: 120s
      - type: metallb-auto-pool
        name: forge-pool
    west-operator-base:
      description: West Grid operator initial deployment with SWIM LoadBalancer
      steps:
      - type: helm
        release: grid-operator
        chart: charts/grid-operator
        version: 0.3.0
        namespace: grid-system
        values:
          image:
            repository: '{{ cluster.properties.operatorImageRepo }}'
            tag: '{{ cluster.properties.operatorImageTag }}'
            digest: '{{ cluster.properties.operatorImageDigest }}'
            pullPolicy: '{{ cluster.properties.imagePullPolicy }}'
          swim:
            siteName: west
            seeds: ''
            service:
              enabled: true
              type: LoadBalancer
          gateway:
            serviceName: provider-gateway
            port: '8443'
      - type: wait
        resource: deployment/grid-operator
        namespace: grid-system
        condition: available
        timeout: 120s
      - type: capture
        resource: svc/grid-operator-swim
        namespace: grid-system
        jsonpath: '{.status.loadBalancer.ingress[0].ip}'
        key: swim-lb-ip
        timeout: 60s
        interval: 2s
    central-operator-base:
      description: Central Grid operator initial deployment with SWIM LoadBalancer
      steps:
      - type: helm
        release: grid-operator
        chart: charts/grid-operator
        version: 0.3.0
        namespace: grid-system
        values:
          image:
            repository: '{{ cluster.properties.operatorImageRepo }}'
            tag: '{{ cluster.properties.operatorImageTag }}'
            digest: '{{ cluster.properties.operatorImageDigest }}'
            pullPolicy: '{{ cluster.properties.imagePullPolicy }}'
          swim:
            siteName: central
            seeds: ''
            service:
              enabled: true
              type: LoadBalancer
          gateway:
            serviceName: provider-gateway
            port: '8443'
      - type: wait
        resource: deployment/grid-operator
        namespace: grid-system
        condition: available
        timeout: 120s
      - type: capture
        resource: svc/grid-operator-swim
        namespace: grid-system
        jsonpath: '{.status.loadBalancer.ingress[0].ip}'
        key: swim-lb-ip
        timeout: 60s
        interval: 2s
    east-operator-base:
      description: East Grid operator initial deployment with SWIM LoadBalancer
      steps:
      - type: helm
        release: grid-operator
        chart: charts/grid-operator
        version: 0.3.0
        namespace: grid-system
        values:
          image:
            repository: '{{ cluster.properties.operatorImageRepo }}'
            tag: '{{ cluster.properties.operatorImageTag }}'
            digest: '{{ cluster.properties.operatorImageDigest }}'
            pullPolicy: '{{ cluster.properties.imagePullPolicy }}'
          swim:
            siteName: east
            seeds: ''
            service:
              enabled: true
              type: LoadBalancer
          gateway:
            serviceName: provider-gateway
            port: '8443'
      - type: wait
        resource: deployment/grid-operator
        namespace: grid-system
        condition: available
        timeout: 120s
      - type: capture
        resource: svc/grid-operator-swim
        namespace: grid-system
        jsonpath: '{.status.loadBalancer.ingress[0].ip}'
        key: swim-lb-ip
        timeout: 60s
        interval: 2s
    west-site:
      description: West combined site with Grid CRs via grid-site chart
      steps:
      - type: manifest
        path: resources/common/grid-swim-key.yaml
      - type: helm
        release: grid-site
        chart: charts/grid-site
        version: 0.3.0
        namespace: grid-system
        values:
          commonLabels:
            grid.praxis.fast/auto-discover-sites: 'true'
          gridNetwork:
            name: grid-combined-site
            gridId: grid-combined-site-v1
            region: west
            zone: west-1
            routingPolicy: scoreFirst
            scoringPolicy:
              strategy: queueDepth
            selectionPolicy:
              mode: deterministic
            tls:
              caSecretRef:
                name: consumer-gateway-tls
                namespace: grid-system
              siteSecretRef:
                name: consumer-gateway-tls
                namespace: grid-system
              swimKeySecretRef:
                name: grid-swim-key
                namespace: grid-system
            consumerGateways:
            - name: consumer-gateway
              namespace: grid-system
              siteName: west
            metricsRefreshInterval: 5s
          gridSite:
            name: west
            region: west
            zone: west-1
            providerSiteLabel: west
          inferenceProviders:
          - name: vcr-west-provider
            gridNetworkRef: grid-combined-site
            providerKind: llm-d-inference-sim
            backendKind: local
            endpoint: http://vcr-inference-west.grid-system.svc.cluster.local:8000
            siteSelector:
              matchLabels:
                grid.praxis.fast/provider-site: west
            accessPolicy:
              siteSelector:
                matchLabels: {}
            models:
            - name: Qwen/Qwen3-0.6B
              capabilities:
              - text_generation
              contextWindow: 4096
            healthCheck:
              path: /health
              interval: 30s
              timeout: 5s
            metricsConfig:
              path: /metrics
              timeout: 2s
              staleMetricsSeconds: 20
              endpoint: http://llmd-epp-metrics.grid-system.svc.cluster.local:9090
              poolName: pool-a
              queueCapacity: 4
              signalNames:
                queueDepth: llm_d_epp_average_queue_size
                healthy: llm_d_epp_ready_endpoints
              auth:
                type: serviceAccountToken
                allowPlaintext: true
    central-site:
      description: Central combined site with Grid CRs via grid-site chart
      steps:
      - type: manifest
        path: resources/common/grid-swim-key.yaml
      - type: helm
        release: grid-site
        chart: charts/grid-site
        version: 0.3.0
        namespace: grid-system
        values:
          commonLabels:
            grid.praxis.fast/auto-discover-sites: 'true'
          gridNetwork:
            name: grid-combined-site
            gridId: grid-combined-site-v1
            region: central
            zone: central-1
            routingPolicy: scoreFirst
            scoringPolicy:
              strategy: queueDepth
            selectionPolicy:
              mode: deterministic
            tls:
              caSecretRef:
                name: consumer-gateway-tls
                namespace: grid-system
              siteSecretRef:
                name: consumer-gateway-tls
                namespace: grid-system
              swimKeySecretRef:
                name: grid-swim-key
                namespace: grid-system
            consumerGateways:
            - name: consumer-gateway
              namespace: grid-system
              siteName: central
            metricsRefreshInterval: 5s
          gridSite:
            name: central
            region: central
            zone: central-1
            providerSiteLabel: central
          inferenceProviders:
          - name: vcr-central-provider
            gridNetworkRef: grid-combined-site
            providerKind: llm-d-inference-sim
            backendKind: local
            endpoint: http://vcr-inference-central.grid-system.svc.cluster.local:8000
            siteSelector:
              matchLabels:
                grid.praxis.fast/provider-site: central
            accessPolicy:
              siteSelector:
                matchLabels: {}
            models:
            - name: Qwen/Qwen3-0.6B
              capabilities:
              - text_generation
              contextWindow: 4096
            healthCheck:
              path: /health
              interval: 30s
              timeout: 5s
            metricsConfig:
              path: /metrics
              timeout: 2s
              staleMetricsSeconds: 20
              endpoint: http://llmd-epp-metrics.grid-system.svc.cluster.local:9090
              poolName: pool-b
              queueCapacity: 4
              signalNames:
                queueDepth: llm_d_epp_average_queue_size
                healthy: llm_d_epp_ready_endpoints
              auth:
                type: serviceAccountToken
                allowPlaintext: true
    east-site:
      description: East combined site with Grid CRs via grid-site chart
      steps:
      - type: manifest
        path: resources/common/grid-swim-key.yaml
      - type: helm
        release: grid-site
        chart: charts/grid-site
        version: 0.3.0
        namespace: grid-system
        values:
          commonLabels:
            grid.praxis.fast/auto-discover-sites: 'true'
          gridNetwork:
            name: grid-combined-site
            gridId: grid-combined-site-v1
            region: east
            zone: east-1
            routingPolicy: scoreFirst
            scoringPolicy:
              strategy: queueDepth
            selectionPolicy:
              mode: deterministic
            tls:
              caSecretRef:
                name: consumer-gateway-tls
                namespace: grid-system
              siteSecretRef:
                name: consumer-gateway-tls
                namespace: grid-system
              swimKeySecretRef:
                name: grid-swim-key
                namespace: grid-system
            consumerGateways:
            - name: consumer-gateway
              namespace: grid-system
              siteName: east
            metricsRefreshInterval: 5s
          gridSite:
            name: east
            region: east
            zone: east-1
            providerSiteLabel: east
          inferenceProviders:
          - name: vcr-east-provider
            gridNetworkRef: grid-combined-site
            providerKind: llm-d-inference-sim
            backendKind: local
            endpoint: http://vcr-inference-east.grid-system.svc.cluster.local:8000
            siteSelector:
              matchLabels:
                grid.praxis.fast/provider-site: east
            accessPolicy:
              siteSelector:
                matchLabels: {}
            models:
            - name: Qwen/Qwen3-0.6B
              capabilities:
              - text_generation
              contextWindow: 4096
            healthCheck:
              path: /health
              interval: 30s
              timeout: 5s
            metricsConfig:
              path: /metrics
              timeout: 2s
              staleMetricsSeconds: 20
              endpoint: http://llmd-epp-metrics.grid-system.svc.cluster.local:9090
              poolName: pool-c
              queueCapacity: 4
              signalNames:
                queueDepth: llm_d_epp_average_queue_size
                healthy: llm_d_epp_ready_endpoints
              auth:
                type: serviceAccountToken
                allowPlaintext: true
    provider-gateway:
      description: Praxis provider gateway with mTLS and credential mounts
      steps:
      - type: helm
        release: provider-gateway
        chart: charts/praxis-gateway
        version: 0.3.0
        namespace: grid-system
        values:
          fullnameOverride: provider-gateway
          image:
            repository: '{{ cluster.properties.gatewayImageRepo }}'
            tag: '{{ cluster.properties.gatewayImageTag }}'
            pullPolicy: '{{ cluster.properties.imagePullPolicy }}'
          podSecurityContext:
            runAsUser: 100
            runAsGroup: 101
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          praxisConfig:
            byo:
              configMapName: provider-gateway-config
          port:
            containerPort: 8443
            name: https-mtls
          service:
            type: LoadBalancer
            port: 8443
          health:
            readiness:
              tcpSocket:
                port: https-mtls
              initialDelaySeconds: 3
              periodSeconds: 5
            liveness:
              tcpSocket:
                port: https-mtls
              initialDelaySeconds: 5
              periodSeconds: 10
          gridIdentity:
            tlsSecretName: provider-gateway-tls
            caSecretName: provider-gateway-tls
          providerCredentials:
          - secretName: vcr-inference-credential
            mountPath: /etc/praxis/credentials/vcr-inference
          podLabels:
            grid.praxis.fast/backend-access: provider-gateway
            grid.praxis.fast/provider-site: '{{ cluster.name }}'
      - type: wait
        resource: deployment/provider-gateway
        namespace: grid-system
        condition: available
        timeout: 120s
      - type: capture
        resource: svc/provider-gateway
        namespace: grid-system
        jsonpath: '{.status.loadBalancer.ingress[0].ip}'
        key: provider-gateway-ip
        timeout: 60s
        interval: 2s
    consumer-gateway:
      description: Praxis consumer gateway with operator-managed overlay
      steps:
      - type: template-file
        source: configs/consumer/praxis.yaml
        target: .forge/runtime/{{ cluster.name }}/consumer/praxis.yaml
      - type: exec
        command:
        - bash
        - -c
        - kubectl --context kind-grid-signals-{{ cluster.name }} -n grid-system create configmap consumer-gateway-config
          --from-file=praxis.yaml=.forge/runtime/{{ cluster.name }}/consumer/praxis.yaml --dry-run=client -o yaml
          | kubectl --context kind-grid-signals-{{ cluster.name }} apply -f -
      - type: helm
        release: consumer-gateway
        chart: charts/praxis-gateway
        version: 0.3.0
        namespace: grid-system
        values:
          fullnameOverride: consumer-gateway
          image:
            repository: '{{ cluster.properties.gatewayImageRepo }}'
            tag: '{{ cluster.properties.gatewayImageTag }}'
            pullPolicy: '{{ cluster.properties.imagePullPolicy }}'
          podSecurityContext:
            runAsUser: 100
            runAsGroup: 101
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          praxisConfig:
            byo:
              configMapName: consumer-gateway-config
          service:
            type: LoadBalancer
          grid:
            networkName: grid-combined-site
            siteName: '{{ cluster.name }}'
          overlay:
            configMapName: grid-overlay-grid-combined-site-consumer-gateway
            sidecar:
              image:
                repository: '{{ cluster.properties.overlaySyncImageRepo }}'
                tag: '{{ cluster.properties.overlaySyncImageTag }}'
                pullPolicy: '{{ cluster.properties.imagePullPolicy }}'
          gridIdentity:
            tlsSecretName: consumer-gateway-tls
            caSecretName: consumer-gateway-tls
          podLabels:
            grid.praxis.fast/consumer-site: '{{ cluster.name }}'
      - type: wait
        resource: deployment/consumer-gateway
        namespace: grid-system
        condition: available
        timeout: 120s
      - type: capture
        resource: svc/consumer-gateway
        namespace: grid-system
        jsonpath: '{.status.loadBalancer.ingress[0].ip}'
        key: consumer-gateway-ip
        timeout: 60s
        interval: 2s
    llmd-backend:
      description: llm-d-sim inference backend and authenticated EPP scheduling metrics
      steps:
      - type: manifest
        path: resources/common/grid-system-namespace.yaml
      - type: manifest
        path: resources/common/inferencepool-crd.yaml
      - type: manifest
        path: resources/common/epp-rbac.yaml
      - type: template-manifest
        path: resources/common/llmd-sim.yaml
      - type: template-manifest
        path: resources/common/epp.yaml
      - type: wait
        resource: deployment/vcr-inference-{{ cluster.name }}
        namespace: grid-system
        condition: available
        timeout: 300s
      - type: wait
        resource: deployment/llmd-epp
        namespace: grid-system
        condition: available
        timeout: 120s
      - type: capture
        resource: svc/llmd-epp-metrics
        namespace: grid-system
        jsonpath: '{.spec.clusterIP}'
        key: epp-metrics-ip
        timeout: 30s
        interval: 2s
    vcr-backend:
      description: Restrict backend ingress to the provider gateway, Grid operator, and EPP metrics scraper
      steps:
      - type: manifest
        path: resources/common/vcr-provider-network-policy.yaml
      - type: wait
        resource: deployment/vcr-inference-{{ cluster.name }}
        namespace: grid-system
        condition: available
        timeout: 300s
