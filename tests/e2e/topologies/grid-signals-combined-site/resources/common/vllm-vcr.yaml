apiVersion: v1
kind: ConfigMap
metadata:
  name: vcr-inference-{{ cluster.name }}-config
  namespace: grid-system
data:
  config.yaml: |
    port: 8000
    model: Qwen/Qwen3-0.6B
    served-model-name: [Qwen/Qwen3-0.6B]
    mode: echo
    # VCR serves CPU-only OpenAI-compatible responses; this mode does not
    # configure synthetic llm-d-sim fake metrics.
    force-dummy-tokenizer: true
    enable-request-id-headers: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcr-inference-{{ cluster.name }}
  namespace: grid-system
  labels:
    app.kubernetes.io/name: vllm-vcr
    app.kubernetes.io/part-of: grid-signals-combined-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-vcr
      app.kubernetes.io/instance: "{{ cluster.name }}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-vcr
        app.kubernetes.io/instance: "{{ cluster.name }}"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: vcr-inference-{{ cluster.name }}-config
      containers:
        - name: vcr
          image: "{{ cluster.properties.vcrImage }}"
          imagePullPolicy: "{{ cluster.properties.imagePullPolicy }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args: ["--config", "/config/config.yaml", "--logtostderr=true"]
          volumeMounts:
            - name: config
              mountPath: /config
          env:
            - name: MODEL
              value: Qwen/Qwen3-0.6B
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_PORT
              value: "8000"
            - name: MOCK_PD_ROLE
              value: "both"
            - name: MOCK_MAX_NUM_SEQS
              value: "4"
            - name: MOCK_KV_CACHE_SIZE
              value: "64"
            - name: MOCK_TOKENS_PER_BLOCK
              value: "16"
            - name: MOCK_MAX_MODEL_LEN
              value: "512"
            - name: MOCK_TTFT_MS
              value: "50"
            - name: MOCK_ITL_MS
              value: "20"
            - name: MOCK_TIME_FACTOR_UNDER_LOAD
              value: "2.0"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /v1/models
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vcr-inference-{{ cluster.name }}
  namespace: grid-system
spec:
  selector:
    app.kubernetes.io/name: vllm-vcr
    app.kubernetes.io/instance: "{{ cluster.name }}"
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: "{{ cluster.properties.poolName }}"
  namespace: grid-system
spec:
  targetPorts:
    - number: 8000
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-vcr
      app.kubernetes.io/instance: "{{ cluster.name }}"
  endpointPickerRef:
    name: llmd-epp
    port:
      number: 9002
