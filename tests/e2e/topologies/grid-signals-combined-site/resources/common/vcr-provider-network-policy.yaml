apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vcr-inference-allow-provider-gateway-only
  namespace: grid-system
  labels:
    app.kubernetes.io/part-of: grid-signals-combined-site
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vllm-vcr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              grid.praxis.fast/backend-access: "provider-gateway"
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grid-operator
      ports:
        - protocol: TCP
          port: 8000
    # EPP polls the model server's /metrics endpoint directly for queue and
    # endpoint-health signals. Keep that access scoped to the serving port.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: llmd-epp
      ports:
        - protocol: TCP
          port: 8000
