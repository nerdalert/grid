apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vcr-inference-allow-required-scrapers
  namespace: grid-system
  labels:
    app.kubernetes.io/part-of: grid-llmd-pool-metrics
spec:
  podSelector:
    matchLabels:
      app: vllm-vcr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              grid.praxis.fast/backend-access: "provider-gateway"
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grid-operator
      ports:
        - protocol: TCP
          port: 8000
    # EPP polls VCR /metrics directly for queue and endpoint-health signals.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: llmd-epp
      ports:
        - protocol: TCP
          port: 8000
