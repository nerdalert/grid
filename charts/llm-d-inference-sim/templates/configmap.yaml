{{- if eq .Values.backend.type "simulator" }}
{{- range .Values.pools }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-d-inference-sim.fullname" $ }}-{{ .name }}-config
  labels:
    {{- include "llm-d-inference-sim.labels" $ | nindent 4 }}
    grid.praxis-proxy.io/pool: static-{{ .name }}
data:
  config.yaml: |
    port: {{ $.Values.service.port }}
    model: {{ $.Values.model | quote }}
    served-model-name: [{{ $.Values.servedModelName | quote }}]
    mode: {{ $.Values.mode | quote }}
    force-dummy-tokenizer: {{ $.Values.forceDummyTokenizer }}
    max-num-seqs: {{ $.Values.maxNumSeqs }}
    max-waiting-queue-length: {{ $.Values.maxWaitingQueueLength }}
    fake-metrics:
      running-requests: {{ $.Values.fakeMetrics.runningRequests }}
      waiting-requests: {{ $.Values.fakeMetrics.waitingRequests }}
      kv-cache-usage: {{ $.Values.fakeMetrics.kvCacheUsage }}
---
{{- end }}
{{- end }}
