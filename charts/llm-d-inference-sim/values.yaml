image:
  repository: ghcr.io/llm-d/llm-d-inference-sim
  tag: v0.10.2
  digest: ""
  pullPolicy: IfNotPresent
backend:
  # simulator is the deterministic default; vllm uses the same Service and
  # scheduling surface when a real GPU backend is available.
  type: simulator
  command: []
  args: []
  env: []
model: gpt-4o-mini
servedModelName: gpt-4o-mini
mode: echo
forceDummyTokenizer: true
maxNumSeqs: 4
maxWaitingQueueLength: 128
fakeMetrics:
  runningRequests: 0
  waitingRequests: 0
  kvCacheUsage: 0.1
pools:
  - name: a
    weight: 50
  - name: b
    weight: 30
  - name: c
    weight: 20
service:
  port: 8000
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
gpu:
  enabled: false
  resourceName: nvidia.com/gpu
  count: 1
nodeSelector: {}
tolerations: []
affinity: {}
podSecurityContext: {}
containerSecurityContext: {}
imagePullSecrets: []
